<app-default-login-layout 
    title="Login into your account" 
    primaryBtnText="Login Now" 
    secondaryBtnText="Singup Now" 
    (submit)="submit()" 
    (navigate)="navigate()"
>
    <form [formGroup]="loginForm">
        <app-primary-input 
            formControlName="email" 
            inputName="email" 
            type="email" 
            label="Email"
            placeholder="diobrando@gmail.com"
        >
            <img src="/svg/email-icon.svg"/>
        </app-primary-input>

        <app-primary-input 
            formControlName="password" 
            inputName="password" 
            type="password" 
            label="Your Password"
            placeholder="*********"
        >
            <img src="/svg/password-icon.svg" />
        </app-primary-input>
        <span>Forgot password?</span>
    </form>
</app-default-login-layout>
