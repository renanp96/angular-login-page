<app-default-login-layout 
    title="Sing in and start today!" 
    primaryBtnText="Singup Now" 
    secondaryBtnText="Login Now" 
    (submit)="submit()" 
    (navigate)="navigate()"
    [disablePrimaryBtn]="!signupForm.valid"
>
    <form [formGroup]="signupForm">
        <app-primary-input formControlName="name" 
            inputName="name" 
            type="text" 
            label="Your name"
            placeholder="Dio Brando"
        >    
        <img src="/svg/email-icon.svg"/>
        </app-primary-input>

        <app-primary-input 
            formControlName="email" 
            inputName="email" 
            type="email" 
            label="Email"
            placeholder="diobrando@gmail.com"
        >
            <img src="/svg/email-icon.svg"/>
        </app-primary-input>

        <app-primary-input 
            formControlName="password" 
            inputName="password" 
            type="password" 
            label="Your Password"
            placeholder="*********"
        >
            <img src="/svg/password-icon.svg" />
        </app-primary-input>
        <app-primary-input 
            formControlName="passwordConfirm" 
            inputName="passwordConfirm" 
            type="password" 
            label="Confirm Your Password"
        >
        <img src="/svg/password-icon.svg" />
        </app-primary-input>
    </form>
</app-default-login-layout>
